[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diemeter"
version = "0.1.0"
description = "High-precision photogrammetric area estimation tool"
requires-python = ">=3.9"
dependencies = [
    "opencv-contrib-python>=4.13",
    "numpy>=2.0",
    "scipy>=1.13",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
diemeter = "diemeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
